  const num = v => (v === '' || v === undefined || v === null || isNaN(Number(v))) ? '' : Number(v);

  async function exportar(E, mesTablero, plantillaB64) {

    for (let i = 0; i < 20; i++) {
      const x = ds[i] || {}, r = 24 + i;
      ins.poner('A' + r, serial(x.inicio)); ins.poner('B' + r, x.insumo || ''); ins.poner('C' + r, num(x.dias)); ins.poner('D' + r, x.accion || '');
      ins.poner('E' + r, x.reportado || ''); ins.poner('F' + r, serial(x.solucion));

    tb.poner('B14', t.hm === '' || t.hm === undefined ? '' : num(t.hm) / 100); tb.poner('B15', t.paqCvc === '' || t.paqCvc === undefined ? '' : num(t.paqCvc) / 100);
    tb.poner('B16', t.paqNav === '' || t.paqNav === undefined ? '' : num(t.paqNav) / 100); tb.poner('B17', num(t.dot));

<script>/* Vigilancia IAAS UCIN — motor de cálculo (replica el libro Vigilancia_IAAS_UCIN_HGR.xlsx) */
(function (root) {
  'use strict';
  const ESTRATOS = ['Menos de 750 g', '750–1000 g', '1001–1500 g', '1501–2500 g', 'Más de 2500 g'];
  const ESTRATOS_C = ['<750 g', '750–1000', '1001–1500', '1501–2500', '>2500 g'];
  const TIPOS = ['ITS asociada a CVC (CLABSI)', 'Neumonía asociada a ventilación (NAV)', 'ITS no asociada a CVC', 'Infección de vías urinarias', 'Enterocolitis necrosante', 'Infección de sitio quirúrgico', 'Infección de piel y tejidos blandos', 'Otra IAAS'];
  const AGENTES = ['Klebsiella pneumoniae', 'Candida spp.', 'Staphylococcus aureus', 'Estafilococo coagulasa negativo', 'Escherichia coli', 'Enterobacter spp.', 'Pseudomonas aeruginosa', 'Acinetobacter baumannii', 'Otro / sin aislamiento'];
  const MESES = 24, DIAS = 731;

  // ---------- fechas (cadenas AAAA-MM-DD, aritmética en UTC) ----------
  const aD = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const aS = t => new Date(t).toISOString().slice(0, 10);
  const sumar = (s, n) => aS(aD(s) + n * 86400000);
  const dif = (a, b) => Math.round((aD(a) - aD(b)) / 86400000); // a - b en días
  const mes = s => s.slice(0, 7);
  const mesMas = (m, n) => { let [y, mm] = m.split('-').map(Number); mm += n; y += Math.floor((mm - 1) / 12); mm = ((mm - 1) % 12 + 12) % 12 + 1; return y + '-' + String(mm).padStart(2, '0'); };
  const diasMes = m => { const [y, mm] = m.split('-').map(Number); return new Date(Date.UTC(y, mm, 0)).getUTCDate(); };

  function estrato(peso) {
    const p = Number(peso);
    if (peso === '' || peso === null || peso === undefined || isNaN(p)) return '';
    if (p < 750) return ESTRATOS[0];
    if (p <= 1000) return ESTRATOS[1];
    if (p <= 1500) return ESTRATOS[2];
    if (p <= 2500) return ESTRATOS[3];
    return ESTRATOS[4];
  }

  // ¿Estaba el paciente en la UCIN a la hora de corte de esa fecha? (propuesta; el censo confirma)
  function presentePropuesto(p, fecha, hora) {
    const corte = fecha + 'T' + (hora || '08:00');
    const ing = (p.ingreso || '') + 'T' + (p.hIngreso || '00:00');
    if (!p.ingreso || ing > corte) return false;
    if (p.egreso) { const eg = p.egreso + 'T' + (p.hEgreso || '23:59'); if (eg <= corte) return false; }
    return true;
  }
  // pacientes que pueden aparecer en el censo de una fecha (ingresados antes del fin del día y no egresados antes del inicio)
  function candidatos(E, fecha) {
    return Object.entries(E.pacs).filter(([, p]) => p.ingreso && p.ingreso <= fecha && (!p.egreso || p.egreso >= fecha)).map(([id, p]) => Object.assign({ id }, p))
      .sort((a, b) => String(a.cuna).localeCompare(String(b.cuna), 'es', { numeric: true }));
  }

  // ---------- denominadores ----------
  function dia(E, fecha) {
    const r = { fecha, dp: [0, 0, 0, 0, 0], cvc: [0, 0, 0, 0, 0], vm: [0, 0, 0, 0, 0], sv: 0, sinPeso: 0, confirmado: !!E.censos[fecha], conDatos: false };
    const filas = E.cd[fecha] || {};
    Object.entries(filas).forEach(([pid, f]) => {
      if (!f.pres) return;
      r.conDatos = true;
      const p = E.pacs[pid]; if (!p) return;
      const i = ESTRATOS.indexOf(estrato(p.peso));
      if (f.sv) r.sv++;
      if (i < 0) { r.sinPeso++; return; }
      r.dp[i]++; if (f.cvc) r.cvc[i]++; if (f.vm) r.vm[i]++;
    });
    const s = a => a.reduce((x, y) => x + y, 0);

    return r;
  }

  // días consecutivos con el dispositivo hasta la fecha del evento (o hasta el día previo si se retiró)
  function diasDispositivo(E, pid, campo, fecha) {
    const tiene = d => { const f = (E.cd[d] || {})[pid]; return !!(f && f.pres && f[campo]); };
    let fin = fecha;
    if (!tiene(fin)) { fin = sumar(fecha, -1); if (!tiene(fin)) return { dias: 0, presente: false, desde: '' }; }
    let n = 0, d = fin;
    while (tiene(d) && n < 400) { n++; d = sumar(d, -1); }

  }

  // ---------- definiciones de caso (lista de apoyo; decide la UVEH con el Manual RHOVE) ----------
  const SIGNOS_ITS = [['fiebre', 'Fiebre >38.0 °C'], ['hipot', 'Hipotermia <36.0 °C'], ['apnea', 'Apnea'], ['bradi', 'Bradicardia']];
  const DEF = {
    [TIPOS[0]]: { disp: 'cvc', dispTxt: 'catéter central o umbilical', grupos: [
      { id: 'lab', t: 'Laboratorio (al menos una)', modo: 'uno', items: [['patog', 'Patógeno reconocido en ≥1 hemocultivo (no es comensal de piel)'], ['comens', 'Comensal común (p. ej., estafilococo coagulasa negativo) en ≥2 hemocultivos de muestras separadas']] },
      { id: 'sig', t: 'Signos (obligatorios si el germen es comensal)', modo: 'info', items: SIGNOS_ITS },
      { id: 'otro', t: 'Descarte', modo: 'todos', items: [['noOtro', 'La bacteriemia no es secundaria a una infección en otro sitio']] }] },
    [TIPOS[2]]: { disp: null, grupos: [
      { id: 'lab', t: 'Laboratorio (al menos una)', modo: 'uno', items: [['patog', 'Patógeno reconocido en ≥1 hemocultivo'], ['comens', 'Comensal común en ≥2 hemocultivos de muestras separadas']] },
      { id: 'sig', t: 'Signos (obligatorios si el germen es comensal)', modo: 'info', items: SIGNOS_ITS },
      { id: 'otro', t: 'Descarte', modo: 'todos', items: [['noOtro', 'No es secundaria a una infección en otro sitio']] }] },
    [TIPOS[1]]: { disp: 'vm', dispTxt: 'ventilación mecánica invasiva', grupos: [
      { id: 'img', t: 'Imagen', modo: 'todos', items: [['rx', 'Infiltrado nuevo o progresivo y persistente, consolidación, cavitación o neumatocele (2 radiografías seriadas si hay enfermedad pulmonar de base)']] },
      { id: 'gas', t: 'Intercambio gaseoso', modo: 'todos', items: [['gas', 'Empeora la oxigenación: desaturación, más FiO₂ o más parámetros del ventilador']] },
      { id: 'cli', t: 'Al menos 3 de los siguientes', modo: 'n3', items: [['term', 'Inestabilidad térmica'], ['leu', 'Leucocitos <4,000 o ≥15,000/mm³ con bandas ≥10%'], ['secr', 'Secreción purulenta nueva, cambio en la secreción o más aspiraciones'], ['resp', 'Apnea, taquipnea, aleteo nasal con retracción o quejido'], ['ausc', 'Sibilancias, estertores o roncus'], ['tos', 'Tos'], ['fc', 'Bradicardia <100 o taquicardia >170 lpm']] }] },
    [TIPOS[3]]: { disp: 'sv', dispTxt: 'sonda vesical', dispOpcional: true, grupos: [
      { id: 'sig', t: 'Al menos un signo', modo: 'uno', items: [['fiebre', 'Fiebre >38.0 °C'], ['hipot', 'Hipotermia <36.0 °C'], ['apnea', 'Apnea'], ['bradi', 'Bradicardia'], ['letar', 'Letargia'], ['vom', 'Vómito']] },
      { id: 'uro', t: 'Laboratorio', modo: 'todos', items: [['uro', 'Urocultivo ≥100,000 UFC/mL con no más de 2 especies']] }] }
  };

  function evaluarCaso(E, c) {
    const def = DEF[c.tipo];
    const r = { aplica: !!def, cumple: null, faltan: [], asoc: null, dia3: null };
    if (!c.fecha) { r.faltan.push('Fecha del evento'); return r; }
    const p = E.pacs[c.pid] || {};
    if (p.ingreso) { r.diaEstancia = dif(c.fecha, p.ingreso) + 1; r.dia3 = r.diaEstancia >= 3; }
    if (!def) return r;
    const chk = c.crit || {};
    if (def.disp) {
      const dd = diasDispositivo(E, c.pid, def.disp, c.fecha);
      r.disp = dd;
      r.asocAuto = dd.dias > 2; // más de 2 días calendario
      r.asoc = chk.asocManual === 'si' ? true : chk.asocManual === 'no' ? false : r.asocAuto;
      if (!r.asoc) r.faltan.push('Asociación a ' + def.dispTxt + ' (>2 días y presente el día del evento o el anterior)');
    }
    if (r.dia3 === false && chk.dia3Manual !== 'si') r.faltan.push('Inicio a partir del 3.er día de estancia (antes se considera adquirida fuera)');
    def.grupos.forEach(g => {
      const n = g.items.filter(([k]) => chk[k]).length;
      if (g.modo === 'uno' && n < 1) r.faltan.push(g.t.replace(/ \(.*\)/, ''));
      if (g.modo === 'todos' && n < g.items.length) r.faltan.push(g.t);
      if (g.modo === 'n3' && n < 3) r.faltan.push('Al menos 3 datos clínicos (lleva ' + n + ')');
    });
    if (def.grupos.some(g => g.id === 'lab') && chk.comens && !chk.patog && !SIGNOS_ITS.some(([k]) => chk[k])) r.faltan.push('Con germen comensal se requiere al menos un signo');
    r.cumple = r.faltan.length === 0;
    return r;
  }

  // ---------- serie mensual (hoja Tasas) ----------
  function serie(E) {
    const ini = E.params.inicio || '2025-12-01';
    const m0 = mes(ini);
    const conf = (E.casos || []).filter(c => c.estado === 'Confirmado' && c.fecha);
    const diasPorMes = {};
    Object.keys(E.cd).forEach(f => { if (f < ini || dif(f, ini) >= DIAS) return; (diasPorMes[mes(f)] = diasPorMes[mes(f)] || []).push(f); });
    const out = [];
    for (let i = 0; i < MESES; i++) {
      const m = mesMas(m0, i);
      const r = { mes: m, dp: 0, cvc: 0, vm: 0, sv: 0, e: { dp: [0, 0, 0, 0, 0], cvc: [0, 0, 0, 0, 0], vm: [0, 0, 0, 0, 0] }, diasCenso: 0, sinPeso: 0 };
      (diasPorMes[m] || []).forEach(f => {
        const d = dia(E, f); if (!d.conDatos) return;
        r.diasCenso++; r.dp += d.tdp; r.cvc += d.tcvc; r.vm += d.tvm; r.sv += d.sv; r.sinPeso += d.sinPeso;
        for (let k = 0; k < 5; k++) { r.e.dp[k] += d.dp[k]; r.e.cvc[k] += d.cvc[k]; r.e.vm[k] += d.vm[k]; }
      });
      const cm = conf.filter(c => mes(c.fecha) === m);
      r.casos = cm.length;
      r.clabsi = cm.filter(c => c.tipo === TIPOS[0]).length;
      r.nav = cm.filter(c => c.tipo === TIPOS[1]).length;
      r.ivu = cm.filter(c => c.tipo === TIPOS[3]).length;
      r.tClabsi = r.cvc > 0 ? r.clabsi / r.cvc * 1000 : '';
      r.tNav = r.vm > 0 ? r.nav / r.vm * 1000 : '';
      r.tIaas = r.dp > 0 ? r.casos / r.dp * 1000 : '';
      r.tIvu = r.sv > 0 ? r.ivu / r.sv * 1000 : '';
      r.usoCvc = r.dp > 0 ? r.cvc / r.dp : '';
      r.usoVm = r.dp > 0 ? r.vm / r.dp : '';
      const ba = Object.entries(E.ba || {}).filter(([f]) => mes(f) === m);
      r.diasBA = ba.filter(([, b]) => b.realizada === 'Sí').length;

      r.pctAcr = req.length === 0 ? '' : req.filter(c => c.acr === 'Sí').length / req.length;
      r.estr = ESTRATOS.map((es, k) => {
        const ce = cm.filter(c => estrato(c.peso) === es);
        return {
          clabsi: r.e.cvc[k] > 0 ? ce.filter(c => c.tipo === TIPOS[0]).length / r.e.cvc[k] * 1000 : '',
          nav: r.e.vm[k] > 0 ? ce.filter(c => c.tipo === TIPOS[1]).length / r.e.vm[k] * 1000 : '',
          iaas: r.e.dp[k] > 0 ? ce.length / r.e.dp[k] * 1000 : ''
        };
      });
      out.push(r);
    }
    return out;
  }

  // ---------- gráfica de control por agente (hoja Control_agentes) ----------
  function control(E) {
    const ini = E.params.inicio || '2025-12-01', m0 = mes(ini);
    const k = Number(E.params.k === undefined || E.params.k === '' ? 2 : E.params.k);
    const min = Number(E.params.min === undefined || E.params.min === '' ? 2 : E.params.min);
    const conf = (E.casos || []).filter(c => c.estado === 'Confirmado' && c.fecha);
    const cuenta = AGENTES.map(() => []);
    const filas = [];
    for (let i = 0; i < MESES; i++) {
      const m = mesMas(m0, i);
      const f = { mes: m, n: [], u: [], alerta: [] };
      AGENTES.forEach((ag, j) => {
        const n = conf.filter(c => mes(c.fecha) === m && c.agente === ag).length;
        cuenta[j].push(n); f.n.push(n);
        let u = '';
        if (i >= 3) {
          const prev = cuenta[j].slice(Math.max(0, i - 12), i);
          const media = prev.reduce((a, b) => a + b, 0) / prev.length;
          const de = Math.sqrt(prev.reduce((a, b) => a + (b - media) * (b - media), 0) / (prev.length - 1));
          u = media + k * de;
        }
        f.u.push(u);
        f.alerta.push(n > 0 && (n >= min || (u !== '' && n > u + 1e-9)));
      });
      f.nAlertas = f.alerta.filter(Boolean).length;
      filas.push(f);
    }
    return filas;
  }

  // alerta temprana: mismo agente en casos confirmados o en estudio dentro de una ventana móvil
  function alertaTemprana(E, hoyS, ventana) {
    const desde = sumar(hoyS, -(ventana || 14));
    const act = (E.casos || []).filter(c => c.estado !== 'Descartado' && c.fecha && c.fecha >= desde && c.fecha <= hoyS && c.agente && c.agente !== AGENTES[8]);
    const g = {};
    act.forEach(c => { (g[c.agente] = g[c.agente] || []).push(c); });
    return Object.entries(g).filter(([, v]) => v.length >= 2).map(([agente, v]) => ({ agente, casos: v }));
  }

  root.Motor = { ESTRATOS, ESTRATOS_C, TIPOS, AGENTES, MESES, DIAS, DEF, SIGNOS_ITS, estrato, dia, candidatos, presentePropuesto, diasDispositivo, evaluarCaso, serie, control, alertaTemprana, f: { sumar, dif, mes, mesMas, diasMes } };
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* Vigilancia IAAS UCIN — aplicación de captura diaria (HGR Reynosa) */
(function () {
  'use strict';
  const M = window.Motor, VD = window.VIG_DEF, LOGO = window.VIG_LOGO;
  const DEFAULT_URL = window.VIG_URL || '';
  const U = 'UCIN';

  // ---------------- almacenamiento ----------------
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };
  let CFG = Object.assign({ url: DEFAULT_URL, token: '', nombre: '', perfil: '', practica: false }, LS.get('vig.cfg', {}));
  if (DEFAULT_URL) CFG.url = DEFAULT_URL;
  const pref = () => CFG.practica ? 'vig.cap.' : 'vig.';
  let DB, OUTBOX;
  function cargarDB() { DB = LS.get(pref() + 'db', { recs: {}, rev: 0 }); OUTBOX = CFG.practica ? {} : LS.get('vig.outbox', {}); CACHE = null; }
  const saveDB = () => { LS.set(pref() + 'db', DB); if (!CFG.practica) LS.set('vig.outbox', OUTBOX); };
  const saveCFG = () => LS.set('vig.cfg', CFG);
  let CACHE = null;
  cargarDB();

  const keyOf = r => r.v + '|' + r.t + '|' + r.k;
  function put(t, k, d, del) {
    const prev = DB.recs[U + '|' + t + '|' + k];
    const rec = { v: U, t, k: String(k), d: d || {}, val: '', u: CFG.nombre || '', ts: Math.max(Date.now(), ((prev || {}).ts || 0) + 1), del: del ? 1 : 0 };
    DB.recs[keyOf(rec)] = rec;
    if (!CFG.practica) { OUTBOX[keyOf(rec)] = rec; programarSync(1500); }
    CACHE = null; saveDB();
    return rec;
  }
  const recs = t => Object.values(DB.recs).filter(r => r.t === t && !r.del);
  const rec = (t, k) => { const r = DB.recs[U + '|' + t + '|' + k]; return r && !r.del ? r : null; };

  // ---------------- sincronización ----------------
  let syncTimer = null, syncing = false, ultimoError = '', pendienteRender = false;
  function programarSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(sincronizar, ms); }
  async function sincronizar() {
    if (CFG.practica || !CFG.url || !CFG.token) { estadoSync(); return; }
    if (syncing) { programarSync(2000); return; }
    if (!navigator.onLine) { ultimoError = 'Sin conexión'; estadoSync(); programarSync(20000); return; }
    syncing = true; estadoSync();
    const enviados = Object.values(OUTBOX).slice(0, 400);
    try {
      const resp = await fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'sync', token: CFG.token, since: DB.rev || 0, records: enviados }) });
      const j = await resp.json();
      if (!j.ok) throw new Error(j.error || 'Error del servidor');
      if (CFG.practica) return;
      enviados.forEach(r => { const o = OUTBOX[keyOf(r)]; if (o && o.ts === r.ts) delete OUTBOX[keyOf(r)]; });
      let cambios = 0;
      (j.records || []).forEach(r => {
        const k = keyOf(r), loc = DB.recs[k];
        if (OUTBOX[k] && OUTBOX[k].ts > r.ts) return;
        if (!loc || r.ts > loc.ts || (r.ts === loc.ts && r.rev && !loc.rev)) { if (!loc || r.ts !== loc.ts || r.del !== loc.del) cambios++; DB.recs[k] = r; }
      });
      DB.rev = Math.max(DB.rev || 0, j.rev || 0);
      CACHE = null; saveDB(); ultimoError = '';
      if (cambios) renderSeguro();
      if (Object.keys(OUTBOX).length) programarSync(500);
    } catch (e) {
      ultimoError = String(e.message || e).includes('Failed to fetch') ? 'No se pudo conectar' : String(e.message || e);
      if (ultimoError === 'Clave del equipo incorrecta') renderSeguro();
    } finally {
      syncing = false; estadoSync();
      programarSync(Object.keys(OUTBOX).length ? 15000 : 30000);
    }
  }
  function textoSync() {
    const p = Object.keys(OUTBOX).length;
    if (CFG.practica) return { c: 'local', t: 'Práctica: solo en este equipo' };
    if (!CFG.url) return { c: 'local', t: 'Solo en este dispositivo' };
    if (!CFG.token) return { c: 'busy', t: 'Sin clave' + (p ? ' · ' + p + ' sin enviar' : '') };
    if (syncing) return { c: 'busy', t: 'Sincronizando…' };
    if (ultimoError) return { c: 'err', t: ultimoError + (p ? ' · ' + p + ' sin enviar' : '') };
    if (p) return { c: 'busy', t: p + ' cambio(s) por enviar' };

  }
  function estadoSync() { const el = document.getElementById('sync'); if (el) { const s = textoSync(); el.className = 'sync ' + s.c; el.textContent = s.t; } }
  window.addEventListener('online', () => programarSync(300));

  // ---------------- utilidades ----------------
  const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const ahoraHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const fc = f => { if (!f) return '—'; const [y, m, d] = f.split('-'); return d + '/' + m + '/' + y; };
  const fcc = f => { if (!f) return '—'; const [, m, d] = f.split('-'); return d + '/' + m; };

  const MESL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  const nml = m => MESL[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const t1 = v => (v === '' || v === undefined || v === null ? '—' : Number(v).toFixed(1));
  const pc = v => (v === '' || v === undefined || v === null ? '—' : Math.round(v * 100) + '%');
  const hora = ts => { if (!ts) return ''; const d = new Date(ts); return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }); };
  const esUVEH = () => CFG.perfil === 'UVEH / PCI';
  const SN = ['Sí', 'No'];
  const chips = (a, k, ops, val, extra) => '<div class="chips">' + ops.map(o => '<button type="button" class="chipb' + (val === o ? ' on' : '') + '" data-a="' + a + '" data-k="' + k + '" data-val="' + esc(o) + '"' + (extra || '') + '>' + esc(o) + '</button>').join('') + '</div>';

  // ---------------- modelo ----------------
  function entrada() {
    const sig = Object.keys(DB.recs).length + ':' + Object.values(DB.recs).reduce((a, r) => Math.max(a, r.ts), 0);
    if (CACHE && CACHE.sig === sig) return CACHE.E;
    const E = { params: Object.assign({ inicio: '2025-12-01', k: 2, min: 2, hora: '08:00', seg: 15, revRiesgos: '' }, (rec('param', 'p') || {}).d || {}), pacs: {}, cd: {}, censos: {}, ba: {}, casos: [], riesgos: {}, insumos: {}, desabasto: [], tablero: {} };
    recs('pac').forEach(r => { E.pacs[r.k] = r.d; });
    recs('cd').forEach(r => { const [f, pid] = r.k.split('|'); (E.cd[f] = E.cd[f] || {})[pid] = r.d; });
    recs('censo').forEach(r => { E.censos[r.k] = Object.assign({ u: r.u, ts: r.ts }, r.d); });
    recs('ba').forEach(r => { E.ba[r.k] = Object.assign({ _u: r.u, _ts: r.ts }, r.d); });
    recs('caso').forEach(r => { const p = E.pacs[r.d.pid] || {}; E.casos.push(Object.assign({ id: r.k, _u: r.u, _ts: r.ts, cuna: p.cuna, peso: p.peso }, r.d)); });
    VD.riesgos.forEach((x, i) => { E.riesgos[i + 1] = Object.assign({}, x); });
    recs('riesgo').forEach(r => { E.riesgos[r.k] = r.d; });
    VD.insumos.forEach((x, i) => { E.insumos[i + 1] = Object.assign({}, x); });
    recs('insumo').forEach(r => { E.insumos[r.k] = r.d; });
    recs('desab').forEach(r => E.desabasto.push(Object.assign({ id: r.k }, r.d)));
    recs('tab').forEach(r => { E.tablero[r.k] = r.d; });
    CACHE = { sig, E };
    return E;
  }
  // valores del censo de una fecha (guardados o propuestos)
  function filasCenso(E, fecha) {
    const guard = E.cd[fecha] || {};
    const ayer = E.cd[M.f.sumar(fecha, -1)] || {};
    const ids = new Set(M.candidatos(E, fecha).map(p => p.id).concat(Object.keys(guard)));
    return Array.from(ids).filter(id => E.pacs[id]).map(id => {
      const p = Object.assign({ id }, E.pacs[id]);
      const g = guard[id];
      const a = ayer[id] && ayer[id].pres ? ayer[id] : {};
      const v = g ? { pres: !!g.pres, vm: !!g.vm, cvc: !!g.cvc, sv: !!g.sv, guardado: true } : { pres: M.presentePropuesto(p, fecha, E.params.hora), vm: !!a.vm, cvc: !!a.cvc, sv: !!a.sv, guardado: false };
      return { p, v };
    }).sort((x, y) => String(x.p.cuna).localeCompare(String(y.p.cuna), 'es', { numeric: true }));
  }

  // ---------------- navegación ----------------
  let S = {};
  function leerHash() { const h = new URLSearchParams(location.hash.slice(1)); S = { p: h.get('p') || 'hoy', id: h.get('id'), f: h.get('f'), m: h.get('m'), pid: h.get('pid'), e: h.get('e') }; }
  function ir(o) { const h = new URLSearchParams(); Object.entries(o).forEach(([k, v]) => { if (v) h.set(k, v); }); location.hash = h.toString(); }
  window.addEventListener('hashchange', () => { leerHash(); EDIT = null; render(); window.scrollTo(0, 0); });

  const $app = () => document.getElementById('app');
  function renderSeguro() {
    const a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !['button', 'checkbox', 'radio'].includes(a.type))) && $app().contains(a)) { pendienteRender = true; return; }
    render(true);
  }
  document.addEventListener('focusout', () => setTimeout(() => { if (pendienteRender) { pendienteRender = false; renderSeguro(); } }, 300));

  const TABS = [['hoy', 'Hoy'], ['pac', 'Pacientes'], ['casos', 'Casos'], ['tasas', 'Tasas'], ['brotes', 'Brotes'], ['riesgos', 'Riesgos'], ['insumos', 'Insumos'], ['mas', 'Más']];
  function barra(titulo, sub, atras) {
    const tabAct = { pac: 'pac', caso: 'casos', tablero: 'mas' }[S.p] || S.p;
    return '<header class="top no-print"><div class="top-in">' +
      (atras ? '<a class="back" href="#' + atras + '" aria-label="Regresar">‹</a>' : '<img class="logo-s" src="' + LOGO + '" alt="IMSS Bienestar">') +
      '<div class="tt"><div class="t1">' + esc(titulo) + '</div><div class="t2">' + (sub || 'Vigilancia de IAAS · UCIN') + '</div></div><div id="sync" class="sync"></div></div>' +
      '<nav class="tabs">' + TABS.map(([k, l]) => '<a href="#p=' + k + '" class="' + (tabAct === k ? 'on' : '') + '">' + l + '</a>').join('') + '</nav></header>' +
      (CFG.practica ? '<div class="capban no-print">🎓 <b>Modo práctica.</b> Nada de lo que capture aquí se envía ni afecta los datos reales. <a href="#p=mas">Salir</a></div>' : '');

    // Censo
    h += '<div class="card"><div class="cab"><h3>Censo de las ' + esc(E.params.hora) + ' · ' + fc(fecha) + '</h3>' +
      (conf ? '<span class="sem v">Confirmado · ' + esc(conf.u) + ' ' + hora(conf.ts) + '</span>' : '<span class="sem a">Sin confirmar</span>') + '</div>';

    else if (!conf) h += '<p class="small muted">Las marcas grises son una propuesta (del día anterior). Corrija lo que haga falta y pulse <b>Confirmar censo</b>.</p>';
    filas.forEach(({ p, v }) => {
      const est = M.ESTRATOS_C[M.ESTRATOS.indexOf(M.estrato(p.peso))] || 'sin peso';
      const dEst = M.f.dif(fecha, p.ingreso) + 1;
      const dd = k => { if (!v.guardado || !v[k]) return ''; const r = M.diasDispositivo(E, p.id, k, fecha); return r.dias ? ' · ' + r.dias + ' d' : ''; };
      const tg = (k, l) => '<button class="tg' + (v[k] ? ' on' : '') + (v.guardado ? '' : ' prop') + '" data-a="tg" data-pid="' + p.id + '" data-k="' + k + '"' + (!v.pres && k !== 'pres' ? ' disabled' : '') + '>' + l + (k !== 'pres' ? dd(k) : '') + '</button>';

    h += '<p class="xs muted">Catéter central incluye CVC, catéter umbilical y PICC. Ventilador = ventilación mecánica invasiva (CPAP no cuenta). Marque lo que el paciente tenía a las ' + esc(E.params.hora) + '.</p></div>';

    // Búsqueda activa

  // ---------------- TASAS ----------------
  function grafica(serie) {
    const W = 640, H = 210, L = 34, R = 10, T = 14, B = 26;
    const vals = serie.flatMap(s => [s.tClabsi, s.tNav]).filter(v => v !== '');
    const mx = Math.max(4, ...vals) * 1.1;
    const x = i => L + i * (W - L - R) / Math.max(1, serie.length - 1), y = v => T + (H - T - B) * (1 - v / mx);
    let s = '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '">';
    for (let k = 0; k <= 4; k++) { const v = mx * k / 4; s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="gt" x="' + (L - 4) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v.toFixed(1) + '</text>'; }
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(2) + '" y2="' + y(2) + '" stroke="#BC955C" stroke-dasharray="5 4" stroke-width="1.5"/><text class="gt" x="' + (W - R) + '" y="' + (y(2) - 4) + '" text-anchor="end">meta ≤2</text>';
    serie.forEach((m, i) => { if (i % 2 === 0 || serie.length < 8) s += '<text class="gt" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + nm(m.mes) + '</text>'; });
    [['tClabsi', '#691C32'], ['tNav', '#4f6f93']].forEach(([k, col]) => {
      let d = '', pen = false;
      serie.forEach((m, i) => { if (m[k] === '') { pen = false; return; } d += (pen ? 'L' : 'M') + x(i) + ' ' + y(m[k]); pen = true; });
      s += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2.5"/>';
      serie.forEach((m, i) => { if (m[k] !== '') s += '<circle cx="' + x(i) + '" cy="' + y(m[k]) + '" r="3.5" fill="' + col + '"/>'; });
    });
    return s + '</svg><div class="ley"><span style="color:#691C32">● CLABSI ×1,000 días-CVC</span><span style="color:#4f6f93">● NAV ×1,000 días-VM</span></div>';
  }
  function vTasas() {
    const E = entrada(), serie = M.serie(E);

    if (s.sinPeso) h += '<div class="card aviso small">' + s.sinPeso + ' día(s)-paciente sin peso al nacer: no entran en las tasas por estrato. Capture el peso en Pacientes.</div>';
    h += '<div class="card"><h3>' + nml(mSel) + '</h3><div class="kvs">' + kv(s.dp, 'Días-paciente') + kv(s.cvc, 'Días-CVC') + kv(s.vm, 'Días-VM') + kv(s.sv, 'Días-sonda') + '</div>' +
      '<div class="kvs">' + kv(t1(s.tClabsi), 'CLABSI ×1,000 días-CVC (' + s.clabsi + ')', sem(s.tClabsi)) + kv(t1(s.tNav), 'NAV ×1,000 días-VM (' + s.nav + ')', sem(s.tNav)) + kv(t1(s.tIaas), 'IAAS ×1,000 días-paciente (' + s.casos + ')') + kv(t1(s.tIvu), 'IVU ×1,000 días-sonda (' + s.ivu + ')') + '</div>' +
      '<div class="kvs">' + kv(s.usoCvc === '' ? '—' : s.usoCvc.toFixed(2), 'Uso de CVC') + kv(s.usoVm === '' ? '—' : s.usoVm.toFixed(2), 'Uso de VM') + kv(pc(baPct), 'Días con búsqueda activa' + (mSel === M.f.mes(hoy()) ? ' (a la fecha)' : ''), baPct >= 0.9 ? 'okk' : 'mid') + kv(s.diasPCI, 'Días con visita PCI') + kv(pc(s.pctNotif), 'Casos notificados en RHOVE') + kv(pc(s.pctAcr), 'Casos con ACR') + '</div></div>';
    h += '<div class="card"><h3>Tendencia</h3>' + grafica(ult) + '</div>';
    h += '<div class="card scroll"><h3>Últimos 12 meses</h3><table class="tbl"><tr><th>Mes</th><th>Días-pac.</th><th>Días-CVC</th><th>Días-VM</th><th>CLABSI</th><th>Tasa</th><th>NAV</th><th>Tasa</th><th>IAAS</th><th>Tasa</th><th>Búsq. activa</th></tr>' +
      ult.map(m => '<tr><td class="nowrap">' + nm(m.mes) + '</td><td>' + m.dp + '</td><td>' + m.cvc + '</td><td>' + m.vm + '</td><td>' + m.clabsi + '</td><td class="' + (m.tClabsi === '' ? '' : m.tClabsi <= 2 ? 'cel-v' : 'cel-r') + '">' + t1(m.tClabsi) + '</td><td>' + m.nav + '</td><td class="' + (m.tNav === '' ? '' : m.tNav <= 2 ? 'cel-v' : 'cel-r') + '">' + t1(m.tNav) + '</td><td>' + m.casos + '</td><td>' + t1(m.tIaas) + '</td><td>' + pc(m.pctBA) + '</td></tr>').join('') + '</table></div>';
    h += '<div class="card scroll"><h3>Por estrato de peso al nacer · ' + nml(mSel) + '</h3><table class="tbl"><tr><th>Estrato</th><th>Días-pac.</th><th>Días-CVC</th><th>Días-VM</th><th>CLABSI ×1,000</th><th>NAV ×1,000</th><th>IAAS ×1,000</th></tr>' +
      M.ESTRATOS.map((e, k) => '<tr><td class="nowrap">' + esc(e) + '</td><td>' + s.e.dp[k] + '</td><td>' + s.e.cvc[k] + '</td><td>' + s.e.vm[k] + '</td><td>' + t1(s.estr[k].clabsi) + '</td><td>' + t1(s.estr[k].nav) + '</td><td>' + t1(s.estr[k].iaas) + '</td></tr>').join('') + '</table><p class="xs muted">Con denominadores pequeños, un solo caso eleva mucho la tasa de un estrato. Interprete con el número de casos y la tendencia.</p></div>';
    return h + '</main>';
  }

  // ---------------- BROTES ----------------
  function vBrotes() {

  // ---------------- INSUMOS ----------------
  function estInsumo(x, seg) {
    const c = Number(x.consumo), dr = Number(x.reabasto), ex = x.existencia;
    const r = { min: '', reorden: '', cob: '', estado: '' };
    if (x.consumo !== '' && x.consumo !== undefined && !isNaN(c)) { r.min = Math.ceil(c / 30 * seg); if (x.reabasto !== '' && x.reabasto !== undefined) r.reorden = Math.ceil(c / 30 * (dr + seg)); }
    if (ex !== '' && ex !== undefined && c) r.cob = Number(ex) / (c / 30);
    if (ex !== '' && ex !== undefined) r.estado = Number(ex) === 0 ? 'DESABASTO' : (r.reorden !== '' && Number(ex) <= r.reorden ? 'REORDENAR' : 'Suficiente');
    return r;
  }

    pacBorrar() { if (!confirm('¿Borrar este paciente? Úselo solo si se registró por error. Sus días de censo dejarán de contar.')) return; const r0 = rec('pac', S.id); put('pac', S.id, r0 ? r0.d : {}, true); EDIT = null; ir({ p: 'pac' }); },
    casoGuardar() {
      const d = EDIT;
      if (!d.pid || !d.fecha || !d.tipo) { alert('Falta: paciente, fecha del evento y tipo de IAAS.'); return; }
      const E = entrada(), id = S.id === 'nuevo' ? uid() : S.id;
      const prev = rec('caso', id);
      if (esUVEH() && d.estado !== 'En estudio' && (!prev || prev.d.estado !== d.estado)) { d.valido = CFG.nombre; d.fValida = hoy(); }
      if (d.estado === 'Confirmado' && !d.folio) {
        const y = d.fecha.slice(0, 4);
        const n = E.casos.filter(c => c.folio && c.folio.startsWith('UCIN-' + y)).map(c => Number(c.folio.split('-')[2]) || 0);
        d.folio = 'UCIN-' + y + '-' + String((n.length ? Math.max(...n) : 0) + 1).padStart(3, '0');
      }
      if (!esUVEH() && !prev) d.estado = 'En estudio';
      const ev = M.evaluarCaso(E, d); d.cumpleApoyo = ev.cumple;
      put('caso', id, d); EDIT = null; toast(d.estado === 'Confirmado' ? 'Caso confirmado · ' + d.folio : 'Caso guardado'); ir({ p: 'casos' });
    },
    casoBorrar() { if (!confirm('¿Borrar este caso?')) return; const r0 = rec('caso', S.id); put('caso', S.id, r0 ? r0.d : {}, true); EDIT = null; ir({ p: 'casos' }); },
    riesgoC(el) { const k = el.dataset.n, E = entrada(), d = Object.assign({}, E.riesgos[k]); d.estatus = d.estatus === el.dataset.val ? '' : el.dataset.val; if (d.estatus === 'Cumplida') d.avance = 100; put('riesgo', k, d); render(true); },
    riesgoNuevo() { const E = entrada(); let k = 1; while (E.riesgos[k] && E.riesgos[k].riesgo) k++; put('riesgo', k, { riesgo: 'Nuevo riesgo', estatus: 'Pendiente', avance: 0 }); render(true); },
    desabNuevo() { put('desab', uid(), { inicio: hoy() }); render(true); },
    desabBorrar(el) { if (!confirm('¿Borrar este registro?')) return; const r0 = rec('desab', el.dataset.id); put('desab', el.dataset.id, r0 ? r0.d : {}, true); render(true); },
    desabC(el) { const r0 = rec('desab', el.dataset.id), d = Object.assign({}, r0 ? r0.d : {}); d.reportado = d.reportado === el.dataset.val ? '' : el.dataset.val; put('desab', el.dataset.id, d); render(true); },
    excel(el) { exportarExcel(el.dataset.m); },
    imprimir() { window.print(); },
    practica(el) { CFG.practica = el.dataset.v === '1'; saveCFG(); cargarDB(); toast(CFG.practica ? 'Modo práctica' : 'Datos reales'); ir({ p: 'hoy' }); render(); programarSync(300); },
    borrarPractica() { if (!confirm('¿Borrar todo lo capturado en práctica?')) return; DB = { recs: {}, rev: 0 }; CACHE = null; saveDB(); render(); },
    ejemplo() { if (Object.keys(DB.recs).length && !confirm('Se agregarán datos de ejemplo a la práctica. ¿Continuar?')) return; cargarEjemplo(); toast('Datos de ejemplo cargados'); ir({ p: 'hoy' }); render(); },
    respaldo() { const b = new Blob([JSON.stringify({ app: 'vigilancia-iaas-ucin', fecha: new Date().toISOString(), practica: CFG.practica, recs: DB.recs }, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'respaldo_vigilancia_ucin_' + hoy() + '.json'; a.click(); },
    borrarLocal() {
      const p = Object.keys(OUTBOX).length;
      if (!confirm('¿Borrar lo guardado en este dispositivo?' + (p ? '\n\nHay ' + p + ' cambio(s) sin enviar a la hoja de Google; se perderán.' : '') + '\n\nLo que ya está en la hoja de Google no se toca: se vuelve a descargar al sincronizar.')) return;
      DB = { recs: {}, rev: 0 }; OUTBOX = {}; CACHE = null; saveDB(); toast('Datos del dispositivo borrados'); programarSync(300); ir({ p: 'hoy' }); render();
    },
    async probar() {
      const out = document.getElementById('prueba'); out.textContent = 'Probando…';
      try { const r = await fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'sync', token: CFG.token, since: 0, records: [] }) }); const j = await r.json(); if (!j.ok) throw new Error(j.error); out.textContent = '✓ Conectado. Registros en el servidor: ' + j.records.length; DB.rev = 0; programarSync(100); }
      catch (e) { out.textContent = '✗ ' + (e.message || e); }
    }
  };

  // ---------------- datos de ejemplo (solo práctica) ----------------
  function cargarEjemplo() {
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const H = hoy(), ini = M.f.sumar(H, -75);
    const cunas = ['131', '132', '133', '134', '135', '136', '137', '138', '139', '140'];
    const ocup = {}; const pacs = [];
    let d = ini, n = 0;
    while (d <= H) {
      cunas.forEach(c => {
        if (ocup[c] && ocup[c].egreso && ocup[c].egreso <= d) delete ocup[c];
        if (!ocup[c] && rnd() < 0.18) {
          const peso = Math.round(600 + rnd() * 2800), est = 5 + Math.round(rnd() * (peso < 1500 ? 45 : 18));
          const eg = M.f.sumar(d, est);
          const p = { id: 'ej' + (++n), cuna: c, exp: String(240000 + n * 37), ingreso: d, hIngreso: '06:30', peso, sdg: Math.round((24 + peso / 140) * 10) / 10, sexo: rnd() < 0.5 ? 'Femenino' : 'Masculino' };
          if (eg <= H) { p.egreso = eg; p.hEgreso = '12:00'; p.motivo = rnd() < 0.9 ? 'Alta a otro servicio' : 'Defunción'; }
          p.cvcIni = rnd() < (peso < 1500 ? 0.85 : 0.45) ? 0 : -1; p.cvcDias = 4 + Math.round(rnd() * 14);
          p.vmIni = rnd() < (peso < 1500 ? 0.6 : 0.25) ? Math.round(rnd() * 2) : -1; p.vmDias = 2 + Math.round(rnd() * 10);
          ocup[c] = p; pacs.push(p);
        }
      });
      d = M.f.sumar(d, 1);
    }
    pacs.forEach(p => { const dd = {}; ['cuna', 'exp', 'ingreso', 'hIngreso', 'peso', 'sdg', 'sexo', 'egreso', 'hEgreso', 'motivo'].forEach(k => { if (p[k] !== undefined) dd[k] = p[k]; }); put('pac', p.id, dd); });
    for (let f = ini; f <= H; f = M.f.sumar(f, 1)) {
      if (f === H) continue; // hoy queda para practicar
      pacs.forEach(p => {
        if (!M.presentePropuesto(p, f, '08:00')) return;
        const di = M.f.dif(f, p.ingreso);
        put('cd', f + '|' + p.id, { pres: 1, cvc: p.cvcIni >= 0 && di >= p.cvcIni + 1 && di <= p.cvcIni + p.cvcDias ? 1 : 0, vm: p.vmIni >= 0 && di >= p.vmIni + 1 && di <= p.vmIni + p.vmDias ? 1 : 0, sv: di >= 1 && di <= 3 && p.peso > 2000 ? 1 : 0 });
      });
      put('censo', f, { hora: '08:1' + Math.floor(rnd() * 9) });
      if (rnd() < 0.88) put('ba', f, { realizada: 'Sí', exp: 'Sí', lab: 'Sí', censo: 'Sí', pci: rnd() < 0.8 ? 'Sí' : 'No', revisados: 6 + Math.floor(rnd() * 4), sospechosos: 0, realizo: 'Enf. PCI (ejemplo)' });
    }
    // casos: busca pacientes con CVC prolongado
    const E = entrada();
    const conCvc = pacs.filter(p => p.cvcIni >= 0 && p.cvcDias >= 7 && M.f.sumar(p.ingreso, p.cvcIni + 6) < H).slice(-3);
    const mk = (p, off, tipo, agente, estado, extra) => {
      const fecha = M.f.sumar(p.ingreso, off);
      const crit = tipo === M.TIPOS[0] ? { patog: true, fiebre: true, noOtro: true } : { rx: true, gas: true, term: true, leu: true, secr: true };
      put('caso', uid(), Object.assign({ pid: p.id, fecha, tipo, crit, agente, estado, muestra: tipo === M.TIPOS[0] ? 'Hemocultivo' : 'Aspirado bronquial', fMuestra: fecha }, extra || {}));
    };
    let nf = 0; const folio = f => 'UCIN-' + f.slice(0, 4) + '-' + String(++nf).padStart(3, '0');
    conCvc.slice(0, 2).forEach((p, j) => { const f = M.f.sumar(p.ingreso, p.cvcIni + 5); mk(p, p.cvcIni + 5, M.TIPOS[0], 'Klebsiella pneumoniae', 'Confirmado', { mdr: 'Sí', resist: 'Productora de carbapenemasa', rhove: 'Sí', fRhove: M.f.sumar(f, 1), acr: j ? '' : 'Sí', fAcr: j ? '' : M.f.sumar(f, 5), folio: folio(f), valido: 'UVEH (ejemplo)', fValida: M.f.sumar(f, 1) }); });
    const conVm = pacs.filter(p => p.vmIni >= 0 && p.vmDias >= 6 && M.f.sumar(p.ingreso, p.vmIni + 5) < H);
    if (conVm.length) { const p = conVm[0], f = M.f.sumar(p.ingreso, p.vmIni + 4); mk(p, p.vmIni + 4, M.TIPOS[1], 'Pseudomonas aeruginosa', 'Confirmado', { mdr: 'No', rhove: 'Sí', fRhove: f, folio: folio(f), valido: 'UVEH (ejemplo)', fValida: f }); }
    if (conCvc[2]) mk(conCvc[2], conCvc[2].cvcIni + 6, M.TIPOS[0], 'Estafilococo coagulasa negativo', 'En estudio', { crit: { comens: true } });
    Object.keys(E.insumos).forEach((k, i) => put('insumo', k, Object.assign({}, E.insumos[k], { consumo: 20 + i * 7, reabasto: 10, existencia: i === 3 ? 0 : 30 + i * 9, fecha: M.f.sumar(H, -2), reviso: 'Enf. PCI (ejemplo)' })));
    put('tab', M.f.mes(H), { hm: 78, paqCvc: 84, paqNav: 88, dot: 410, mensaje: 'Ejemplo: revisemos juntos el paquete de mantenimiento del catéter en cada cambio de turno.' });
  }

  let toastT;
  function toast(t) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); } el.textContent = t; el.className = 'show'; clearTimeout(toastT); toastT = setTimeout(() => el.className = '', 1700); }

  // ---------------- eventos ----------------
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return;
    if (ACC[el.dataset.a]) { e.preventDefault(); ACC[el.dataset.a](el); }
  });
  function guardarCampo(el) {
    const a = el.dataset.a, k = el.dataset.k;
    const val = el.type === 'checkbox' ? el.checked : el.value;
    if (a === 'ed') { EDIT[k] = val; return; }
    if (a === 'edr') { EDIT[k] = val; render(true); return; }
    if (a === 'crit') { EDIT.crit[k] = el.dataset.v ? (el.checked ? el.dataset.v : '') : el.checked; render(true); return; }
    if (a === 'baIn') { const r0 = rec('ba', el.dataset.f), d = Object.assign({}, r0 ? r0.d : {}); d[k] = el.type === 'number' ? (val === '' ? '' : Number(val)) : val; put('ba', el.dataset.f, d); return; }
    if (a === 'param') { const r0 = rec('param', 'p'), d = Object.assign({}, r0 ? r0.d : {}); d[k] = el.type === 'number' ? Number(val) : val; put('param', 'p', d); render(true); return; }
    if (a === 'riesgo') { const E = entrada(), d = Object.assign({}, E.riesgos[el.dataset.n]); d[k] = el.type === 'number' ? (val === '' ? '' : Number(val)) : val; put('riesgo', el.dataset.n, d); render(true); return; }
    if (a === 'insumo') { const E = entrada(), d = Object.assign({}, E.insumos[el.dataset.n]); d[k] = el.type === 'number' ? (val === '' ? '' : Number(val)) : val; put('insumo', el.dataset.n, d); render(true); return; }
    if (a === 'desab') { const r0 = rec('desab', el.dataset.id), d = Object.assign({}, r0 ? r0.d : {}); d[k] = el.type === 'number' ? (val === '' ? '' : Number(val)) : val; put('desab', el.dataset.id, d); return; }
    if (a === 'tab') { const r0 = rec('tab', el.dataset.m), d = Object.assign({}, r0 ? r0.d : {}); d[k] = el.type === 'number' ? (val === '' ? '' : Number(val)) : val; put('tab', el.dataset.m, d); return; }
    if (a === 'mesSel') { ir({ p: el.dataset.p, m: val }); return; }
  }
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'importar') { importar(el.files[0]); return; }
    if (el.id === 'fechaHoy') { if (el.value) ir({ p: 'hoy', f: el.value === hoy() ? '' : el.value }); return; }
    if (el.dataset.cfg) { CFG[el.dataset.cfg] = el.value.trim(); saveCFG(); if (el.dataset.cfg === 'token') { ultimoError = ''; programarSync(200); } render(true); return; }
    if (el.dataset.a) guardarCampo(el);
  });
  document.addEventListener('input', e => { const el = e.target; if (el.dataset.a === 'ed') EDIT[el.dataset.k] = el.value; });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'clave') ACC.guardarClave(); if (e.key === 'Enter' && e.target.id === 'nomIni') ACC.guardarInicio(); });

  function importar(f) {
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result); let n = 0;
        Object.values(j.recs || {}).forEach(r => { const k = keyOf(r); if (!DB.recs[k] || DB.recs[k].ts < r.ts) { DB.recs[k] = r; if (!CFG.practica) OUTBOX[k] = r; n++; } });
        CACHE = null; saveDB(); alert('Se importaron ' + n + ' registros.'); programarSync(300); render();
      } catch (e) { alert('El archivo no es un respaldo válido.'); }
    };
    rd.readAsText(f);
  }

  leerHash(); render(); programarSync(400);
  if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.__vig = { entrada, put, DB: () => DB };
})();
</script>
